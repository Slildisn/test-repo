<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bcdcf2">
<title>铁墓 · 风之庭院</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#bcdcf2;color:#20303f;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;user-select:none;touch-action:none;}
  body.rot{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;
    transform:rotate(90deg) translateY(-100vw);}
  canvas{display:block;width:100%;height:100%;}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(circle at 50% 46%,transparent 48%,rgba(20,40,60,.14) 100%);}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  #tip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:2px;color:#eaf6ff;padding:7px 14px;border-radius:20px;
    background:rgba(24,52,78,.55);border:1px solid rgba(255,255,255,.18);white-space:nowrap;}
  #speed{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:3px;color:#e8f4ff;text-shadow:0 1px 3px rgba(0,30,50,.6);}
  #stick{position:absolute;left:22px;bottom:calc(56px + env(safe-area-inset-bottom));width:118px;height:118px;
    border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:radial-gradient(circle,rgba(30,60,85,.18),rgba(255,255,255,.06));
    box-shadow:inset 0 0 24px rgba(255,255,255,.14);}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.92),rgba(150,205,235,.5));
    box-shadow:0 0 18px rgba(255,255,255,.5);}
  #run{position:absolute;right:26px;bottom:calc(58px + env(safe-area-inset-bottom));width:76px;height:76px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:3px;color:#f2fffb;
    border:1px solid rgba(255,255,255,.4);background:radial-gradient(circle,rgba(60,180,150,.4),rgba(20,90,80,.2));
    box-shadow:0 2px 12px rgba(0,40,60,.25);}
  #jump{position:absolute;right:calc(34px + env(safe-area-inset-right));bottom:calc(148px + env(safe-area-inset-bottom));
    width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;letter-spacing:3px;color:#fff6e8;border:1px solid rgba(255,255,255,.4);
    background:radial-gradient(circle,rgba(240,170,90,.45),rgba(140,80,30,.2));
    box-shadow:0 2px 12px rgba(60,35,10,.25);pointer-events:auto;}
  #jump.on{background:radial-gradient(circle,rgba(255,225,160,.75),rgba(190,120,40,.45));}
  #run.on{background:radial-gradient(circle,rgba(120,255,205,.7),rgba(20,150,120,.45));
    box-shadow:0 0 26px rgba(60,230,180,.6);}
  #mapwrap{position:absolute;top:calc(52px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:118px;height:118px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.35);
    box-shadow:0 4px 18px rgba(0,30,60,.28);background:rgba(22,44,60,.55);}
  #mapwrap canvas{width:100%;height:100%;display:block;}
  #coord{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(175px + env(safe-area-inset-top));
    font-size:9.5px;letter-spacing:1.5px;color:#eef8ff;text-shadow:0 1px 3px rgba(0,30,50,.65);font-variant-numeric:tabular-nums;}
  #overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:13px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 30%,rgba(150,205,238,.95),rgba(88,146,188,.96) 70%);}
  #overlay h1{font-size:26px;letter-spacing:4px;color:#ffffff;text-shadow:0 2px 12px rgba(20,70,110,.55);}
  #overlay .tag{font-size:10px;letter-spacing:6px;color:#e6f5ff;margin-top:-9px;}
  #overlay .sub{font-size:12.5px;line-height:1.95;color:#f2f9ff;max-width:330px;text-shadow:0 1px 6px rgba(20,70,110,.4);}
  #overlay .key{display:inline-block;border:1px solid rgba(255,255,255,.45);border-radius:5px;
    padding:1px 6px;margin:0 2px;font-size:11px;color:#ffffff;background:rgba(255,255,255,.16);}
  #start{margin-top:2px;padding:13px 40px;border-radius:30px;border:1px solid rgba(255,255,255,.7);
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(150,210,240,.32));color:#123246;
    font-size:15px;letter-spacing:6px;font-weight:600;box-shadow:0 6px 22px rgba(15,60,95,.3);}
  #start:active{transform:scale(.96);filter:brightness(1.1);}
  @media (orientation:landscape){
    #tip{top:10px;font-size:10px;padding:6px 12px;}
    #stick{width:100px;height:100px;left:calc(16px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));}
    #knob{width:40px;height:40px;margin:-20px 0 0 -20px;}
    #run{width:66px;height:66px;right:calc(20px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));}
    #jump{width:54px;height:54px;right:calc(24px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));}
    #speed{bottom:calc(8px + env(safe-area-inset-bottom));font-size:9px;}
    #overlay{gap:9px;}
    #overlay h1{font-size:20px;}
    #overlay .sub{line-height:1.7;max-width:560px;}
    #mapwrap{top:calc(44px + env(safe-area-inset-top));width:104px;height:104px;}
    #coord{top:calc(154px + env(safe-area-inset-top));}
  }
  body.rot #tip{top:10px;font-size:10px;padding:6px 12px;}
  body.rot #stick{width:100px;height:100px;left:16px;bottom:30px;}
  body.rot #knob{width:40px;height:40px;margin:-20px 0 0 -20px;}
  body.rot #run{width:66px;height:66px;right:20px;bottom:30px;}
  body.rot #jump{width:58px;height:58px;right:24px;bottom:110px;}
  body.rot #speed{bottom:8px;font-size:9px;}
  body.rot #overlay{gap:9px;}
  body.rot #overlay h1{font-size:20px;}
  body.rot #overlay .sub{line-height:1.7;max-width:560px;}
  body.rot #mapwrap{top:44px;right:14px;width:104px;height:104px;}
  body.rot #coord{right:14px;top:154px;}
  #view{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(52px + env(safe-area-inset-top));
    padding:7px 12px;border-radius:16px;font-size:10.5px;letter-spacing:2px;color:#f2faff;
    border:1px solid rgba(255,255,255,.4);background:rgba(24,52,78,.6);pointer-events:auto;}
  #view.fp{color:#fff0d2;border-color:rgba(255,225,170,.7);background:rgba(90,60,24,.7);}
  body.rot #view{left:14px;top:44px;}
  @media (max-height:420px){#overlay .sub{display:none;}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="hud">
  <div id="tip">左摇杆走 · 拖动转视角 · 疾跑点一下</div>
  <div id="speed">STROLLING</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="run">疾跑</div>
  <div id="jump">跳跃</div>
  <div id="mapwrap"><canvas id="map" width="236" height="236"></canvas></div>
  <div id="coord">X 0 · Z 0</div>
  <div id="view">第一人称</div>
</div>

<div id="overlay">
  <h1>铁墓 · 风之庭院</h1>
  <div class="tag">GARDEN ROAM · DAYLIGHT</div>
  <div class="sub">
    晴天的庭院，没有枪，也没人追你。走一圈看看塔、镜湖和石桥。<br>
    手机：左摇杆移动 · 右侧拖动转视角 · 右下点疾跑（再点一次停）· 跳跃键<br>
    电脑：<span class="key">W A S D</span> 移动 · <span class="key">Shift</span> 疾跑 · 手机上点「疾跑」切换 · <span class="key">空格</span> 跳 · <span class="key">V</span> 切视角 · <span class="key">拖动鼠标</span> 转视角 · <span class="key">滚轮</span> 远近
  </div>
  <button id="start">开始漫游</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
let THREE;
try { THREE = await import('three'); }
catch (e1) {
  try { THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'); }
  catch (e2) { showFatal('三维库加载失败，检查网络后刷新。'); throw e2; }
}
function showFatal(msg) {
  const o = document.getElementById('overlay');
  if (!o) return;
  o.style.display = 'flex';
  o.innerHTML = '<h1 style="font-size:22px">启动失败</h1><div class="sub">' + msg + '</div>';
}

const cv = document.getElementById('cv');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  showFatal('浏览器没开 WebGL（3D 加速）。用 Chrome / Safari 打开，或开启硬件加速后刷新。');
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xdceaf6, 0.0075);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 260);

function skyTexture() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#4a93cf');
  grd.addColorStop(.35, '#7db9e4');
  grd.addColorStop(.62, '#b3d9f0');
  grd.addColorStop(1, '#e3f1fa');
  g.fillStyle = grd; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = skyTexture();

/* ---------- 光（白天） ---------- */
scene.add(new THREE.HemisphereLight(0xdcefff, 0x6b7a58, 1.35));
const sun = new THREE.DirectionalLight(0xfff3dd, 2.35);
sun.position.set(20, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0012;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xc9dcf0, 0.5));

/* ---------- 地面 ---------- */
const GROUND = 60;
function grassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#4c6b4a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 4200; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = 1 + Math.random() * 2.2;
    g.fillStyle = Math.random() < .5 ? 'rgba(112,146,96,.5)' : 'rgba(58,86,58,.55)';
    g.beginPath(); g.arc(x, y, r, 0, 6.28); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(24, 24);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND * 2, GROUND * 2),
  new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: .95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* 中央石径 */
const pathMat = new THREE.MeshStandardMaterial({ color: 0x8a8b84, roughness: .9 });
for (let i = 0; i < 62; i++) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(1.5 + Math.random() * .8, 9), pathMat);
  s.rotation.x = -Math.PI / 2;
  s.position.set((Math.random() - .5) * 5, .015, 42 - i * 1.45);
  s.receiveShadow = true;
  scene.add(s);
}

/* 地标坐标（提前定义，供场景布置避让使用） */
const TOWER = { x: -25, z: -24, r: 3.2 };
const POND = { x: 18, z: -26, r: 9 };
const BRIDGE = { x: 18, halfW: 1.9, z0: -38.5, z1: -13.5, h: 1.6 };

/* ---------- 碰撞体 ---------- */
const blockers = [];
const mapTrees = [], mapRocks = [];
function addBlock(x, z, r, h) { blockers.push({ x, z, r, h: h || 1.6 }); }

/* ---------- 道具 ---------- */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b5238, roughness: .9 });
const pineMat = new THREE.MeshStandardMaterial({ color: 0x3f7a58, roughness: .85 });
const pineMat2 = new THREE.MeshStandardMaterial({ color: 0x336a4c, roughness: .85 });

function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .28, 2.2, 8), trunkMat);
  trunk.position.y = 1.1; trunk.castShadow = true;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(1.5 - i * .38, 1.6, 9), i % 2 ? pineMat2 : pineMat);
    c.position.y = 2.1 + i * .95; c.castShadow = true;
    g.add(c);
  }
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  g.rotation.y = Math.random() * 6.28;
  scene.add(g);
  addBlock(x, z, .55 * s, 4 * s);
  mapTrees.push({ x, z });
}
for (let i = 0; i < 64; i++) {
  let a = Math.random() * 6.28, r = 12 + Math.random() * (GROUND - 18);
  let x = Math.sin(a) * r, z = Math.cos(a) * r;
  for (let k = 0; k < 20 && nearLandmark(x, z, 2.6); k++) {
    a = Math.random() * 6.28; r = 12 + Math.random() * (GROUND - 18);
    x = Math.sin(a) * r; z = Math.cos(a) * r;
  }
  if (nearLandmark(x, z, 2.6)) continue;
  tree(x, z, .85 + Math.random() * .55);
}

function rock(x, z, s) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0),
    new THREE.MeshStandardMaterial({ color: 0x8b93a0, roughness: .95, flatShading: true }));
  m.position.set(x, s * .55, z);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  addBlock(x, z, s * .75, s * 1.5);
  mapRocks.push({ x, z });
}
for (let i = 0; i < 42; i++) {
  let a = Math.random() * 6.28, r = 8 + Math.random() * (GROUND - 12);
  let x = Math.sin(a) * r, z = Math.cos(a) * r;
  for (let k = 0; k < 20 && nearLandmark(x, z, 3); k++) {
    a = Math.random() * 6.28; r = 8 + Math.random() * (GROUND - 12);
    x = Math.sin(a) * r; z = Math.cos(a) * r;
  }
  if (nearLandmark(x, z, 3)) continue;
  rock(x, z, .5 + Math.random() * .7);
}

/* 灯笼 */
const lanterns = [];
function lantern(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 2.6, 8), trunkMat);
  pole.position.y = 1.3; pole.castShadow = true;
  g.add(pole);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(.22, 14, 12),
    new THREE.MeshStandardMaterial({ color: 0xfff0d2, emissive: 0xffb060, emissiveIntensity: 0.7, roughness: .4 }));
  orb.position.y = 2.75;
  g.add(orb);
  const pl = new THREE.PointLight(0xffc483, 0.55, 12, 1.6);
  pl.position.y = 2.75;
  g.add(pl);
  g.position.set(x, 0, z);
  scene.add(g);
  lanterns.push({ orb, light: pl, phase: Math.random() * 6.28 });
  addBlock(x, z, .3, 3);
}
lantern(-4.5, 6); lantern(4.5, 6); lantern(-5, -5); lantern(5, -5);

/* 围栏 */
const fenceMat = new THREE.MeshStandardMaterial({ color: 0x8a8a80, roughness: .9 });
const ring = new THREE.Group();
for (let i = 0; i < 132; i++) {
  const a = i / 132 * 6.283;
  const x = Math.sin(a) * (GROUND - 4), z = Math.cos(a) * (GROUND - 4);
  const post = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.1, .12), fenceMat);
  post.position.set(x, .55, z);
  post.rotation.y = a;
  post.castShadow = true;
  ring.add(post);
}
scene.add(ring);

/* ---------- 地标：高塔 / 镜湖 / 石桥 ---------- */
const ripples = [];
const pondCircles = [];

function nearLandmark(x, z, pad) {
  if (Math.hypot(x - POND.x, z - POND.z) < POND.r + pad + 2.2) return true;
  if (Math.hypot(x - TOWER.x, z - TOWER.z) < TOWER.r + pad) return true;
  if (Math.abs(x - BRIDGE.x) < BRIDGE.halfW + pad + .8 && z > BRIDGE.z0 - pad - 1 && z < BRIDGE.z1 + pad + 1) return true;
  return false;
}

function heightAt(x, z) {
  if (Math.abs(x - BRIDGE.x) <= BRIDGE.halfW && z > BRIDGE.z0 && z < BRIDGE.z1) {
    const t = (z - BRIDGE.z0) / (BRIDGE.z1 - BRIDGE.z0);
    return Math.sin(Math.PI * t) * BRIDGE.h;
  }
  return 0;
}

/* 塔 */
(function buildTower() {
  const g = new THREE.Group();
  const stone = new THREE.MeshStandardMaterial({ color: 0x8f8b82, roughness: .88, metalness: .06 });
  const stone2 = new THREE.MeshStandardMaterial({ color: 0x7c7870, roughness: .9 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.1, 3.5, 1.2, 16), stone2);
  base.position.y = .6; base.castShadow = true; base.receiveShadow = true;
  g.add(base);

  for (let i = 0; i < 3; i++) {
    const rTop = 2.5 - i * .45, rBot = 2.9 - i * .45, h = 3.2;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 16), i % 2 ? stone2 : stone);
    seg.position.y = 1.2 + h / 2 + i * (h + .15);
    seg.castShadow = true; seg.receiveShadow = true;
    g.add(seg);
    const band = new THREE.Mesh(new THREE.TorusGeometry(rTop + .05, .1, 6, 18),
      new THREE.MeshStandardMaterial({ color: 0xd8b887, roughness: .6, metalness: .3 }));
    band.rotation.x = Math.PI / 2;
    band.position.y = 1.2 + h + i * (h + .15);
    g.add(band);
  }

  const cap = new THREE.Mesh(new THREE.ConeGeometry(2.05, 2.6, 16), stone2);
  cap.position.y = 11.9; cap.castShadow = true;
  g.add(cap);

  const orb = new THREE.Mesh(new THREE.SphereGeometry(.5, 18, 14),
    new THREE.MeshStandardMaterial({ color: 0xfff2c9, emissive: 0xffc070, emissiveIntensity: 1.2, roughness: .3 }));
  orb.position.y = 13.6;
  g.add(orb);
  const orbLight = new THREE.PointLight(0xffc483, 1.2, 34, 1.8);
  orbLight.position.y = 13.6;
  g.add(orbLight);

  for (let i = 0; i < 6; i++) {
    const a = i / 6 * 6.283 + .3;
    const win = new THREE.Mesh(new THREE.BoxGeometry(.5, .9, .12),
      new THREE.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffb268, emissiveIntensity: .8, roughness: .4 }));
    win.position.set(Math.sin(a) * 2.78, 3.4, Math.cos(a) * 2.78);
    win.rotation.y = a;
    g.add(win);
  }

  g.position.set(TOWER.x, 0, TOWER.z);
  g.rotation.y = .6;
  scene.add(g);
  addBlock(TOWER.x, TOWER.z, TOWER.r, 14);
  window.__towerOrb = orb;
})();

/* 镜湖 */
(function buildPond() {
  const sand = new THREE.Mesh(new THREE.RingGeometry(POND.r - .4, POND.r + 2.2, 40),
    new THREE.MeshStandardMaterial({ color: 0xc8b58c, roughness: 1 }));
  sand.rotation.x = -Math.PI / 2;
  sand.position.set(POND.x, .02, POND.z);
  sand.receiveShadow = true;
  scene.add(sand);

  const water = new THREE.Mesh(new THREE.CircleGeometry(POND.r, 48),
    new THREE.MeshStandardMaterial({ color: 0x4a9cc2, roughness: .14, metalness: .6,
      transparent: true, opacity: .62 }));
  water.rotation.x = -Math.PI / 2;
  water.position.set(POND.x, .06, POND.z);
  scene.add(water);

  const glow = new THREE.PointLight(0x9fe8ff, 0.35, 26, 1.8);
  glow.position.set(POND.x, 1.2, POND.z);
  scene.add(glow);

  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(new THREE.RingGeometry(.22, .34, 28),
      new THREE.MeshBasicMaterial({ color: 0xeafcff, transparent: true, opacity: .35,
        side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    let rx, rz, tries = 0;
    do {
      const a = Math.random() * 6.283, rr = Math.random() * (POND.r - 3.2);
      rx = POND.x + Math.sin(a) * rr;
      rz = POND.z + Math.cos(a) * rr;
      tries++;
    } while ((Math.abs(rx - BRIDGE.x) < 4.2 && rz > BRIDGE.z0 - 2 && rz < BRIDGE.z1 + 2) && tries < 25);
    m.position.set(rx, .09, rz);
    scene.add(m);
    ripples.push({ mesh: m, t: Math.random() });
  }

  for (let i = 0; i < 16; i++) {
    const a = Math.random() * 6.283, rr = POND.r - .2 + Math.random() * 1.2;
    const reed = new THREE.Mesh(new THREE.CylinderGeometry(.03, .05, .9 + Math.random() * .7, 5),
      new THREE.MeshStandardMaterial({ color: 0x5c8a52, roughness: .9 }));
    reed.position.set(POND.x + Math.sin(a) * rr, .5, POND.z + Math.cos(a) * rr);
    reed.rotation.z = (Math.random() - .5) * .3;
    scene.add(reed);
    pondCircles.push(reed);
  }
})();

/* 石桥 */
(function buildBridge() {
  const g = new THREE.Group();
  const slabMat = new THREE.MeshStandardMaterial({ color: 0xc3bcae, roughness: .92, flatShading: true });
  const railMat = new THREE.MeshStandardMaterial({ color: 0xa9a294, roughness: .9 });
  const len = BRIDGE.z1 - BRIDGE.z0;
  const steps = 22;
  const pierMat0 = new THREE.MeshStandardMaterial({ color: 0xb0a99b, roughness: .95, flatShading: true });
  for (let i = 0; i < steps; i++) {
    const t = (i + .5) / steps;
    const z = BRIDGE.z0 + t * len;
    const y = Math.sin(Math.PI * t) * BRIDGE.h;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE.halfW * 2 - .1, .14, len / steps + .22), slabMat);
    slab.position.set(BRIDGE.x, y - .09, z);
    slab.castShadow = true; slab.receiveShadow = true;
    g.add(slab);

    // 连续矮护栏（原来隔一块才有，容易看成断裂）
    for (const side of [-1, 1]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(.14, .62, len / steps + .04), railMat);
      rail.position.set(BRIDGE.x + side * (BRIDGE.halfW - .1), y + .26, z);
      rail.castShadow = true;
      g.add(rail);
    }

    // 桥腹实心侧墙：从水面一直填到桥面，低角度不会看穿桥体
    if (y > .12) {
      for (const side of [-1, 1]) {
        const wallH = Math.max(.14, y - .02);
        const wall = new THREE.Mesh(new THREE.BoxGeometry(.16, wallH, len / steps + .05), pierMat0);
        wall.position.set(BRIDGE.x + side * (BRIDGE.halfW - .06), .06 + wallH / 2, z);
        wall.castShadow = true; wall.receiveShadow = true;
        g.add(wall);
      }
    }
  }

  // 引道 + 桥墩：全部压在桥面以下，桥面上不再冒出石块
  const pierMat = new THREE.MeshStandardMaterial({ color: 0x9e9madd, roughness: .95, flatShading: true });
  for (const t of [0, 1]) {
    const z = BRIDGE.z0 + t * len;
    const abut = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE.halfW * 2 + .5, .5, 1.6), pierMat);
    abut.position.set(BRIDGE.x, -.1, z + (t === 0 ? -0.85 : 0.85));
    abut.castShadow = true; abut.receiveShadow = true;
    g.add(abut);
  }
  for (const t of [.3, .7]) {
    const z = BRIDGE.z0 + t * len;
    const deckY = Math.sin(Math.PI * t) * BRIDGE.h;
    const pierH = Math.max(.5, deckY - .28);
    const pier = new THREE.Mesh(new THREE.CylinderGeometry(.55, .75, pierH, 10), pierMat);
    pier.position.set(BRIDGE.x, pierH / 2, z);
    pier.castShadow = true;
    g.add(pier);
  }

  scene.add(g);
})();

let camYaw = 0, camPitch = .38, camDist = 6.2;

/* ---------- 方向 / 尺寸 ---------- */
let rotMode = false, rotUserSet = false;
try {
  const v = localStorage.getItem('garden_rot');
  if (v === '1' || v === '0') { rotMode = v === '1'; rotUserSet = true; }
} catch (e) {}
if (!rotUserSet) rotMode = innerWidth < innerHeight;

function toLocalPt(cx, cy) {
  if (!rotMode) return { x: cx, y: cy };
  return { x: cy, y: innerWidth - cx };
}
function stageSize() {
  return rotMode ? { w: innerHeight, h: innerWidth } : { w: innerWidth, h: innerHeight };
}
function fitViewport() {
  const s = stageSize();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.9));
  renderer.setSize(s.w, s.h, false);
  camera.aspect = s.w / s.h;
  camera.updateProjectionMatrix();
}
function syncRot(persist) {
  const land = innerWidth > innerHeight;
  if (!rotUserSet) rotMode = !land;
  if (land) rotMode = false;
  document.body.classList.toggle('rot', rotMode);
  fitViewport();
  setTimeout(fitViewport, 120);
  if (persist) { try { localStorage.setItem('garden_rot', rotMode ? '1' : '0'); } catch (e) {} }
}
addEventListener('resize', () => syncRot(false));
addEventListener('orientationchange', () => { syncRot(false); setTimeout(() => syncRot(false), 300); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => syncRot(false));

/* ---------- 触摸 ---------- */
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
const runBtn = document.getElementById('run');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');
const viewBtn = document.getElementById('view');
const jumpBtn = document.getElementById('jump');

function clampPitch(v) {
  return THREE.MathUtils.clamp(v, firstPerson ? -1.15 : .04, firstPerson ? 1.25 : 1.05);
}
function setView(fp) {
  firstPerson = fp;
  avatar.visible = !fp;
  aura.visible = !fp;
  viewBtn.textContent = fp ? '第三人称' : '第一人称';
  viewBtn.classList.toggle('fp', fp);
  if (!fp) camPitch = THREE.MathUtils.clamp(camPitch, .04, 1.05);
  camReady = false;
}
jumpBtn.addEventListener('touchstart', e => {
  e.stopPropagation(); e.preventDefault();
  doJump(); jumpBtn.classList.add('on');
}, { passive: false });
jumpBtn.addEventListener('touchend', () => jumpBtn.classList.remove('on'));
jumpBtn.addEventListener('click', e => { e.stopPropagation(); doJump(); });
viewBtn.addEventListener('click', e => { e.stopPropagation(); setView(!firstPerson); });
viewBtn.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); setView(!firstPerson); }, { passive: false });

function circleOf(el) {
  const r = el.getBoundingClientRect();
  const c = toLocalPt(r.left + r.width / 2, r.top + r.height / 2);
  return { x: c.x, y: c.y, rad: Math.max(r.width, r.height) / 2 * 1.15 };
}
function inCircle(p, c) { return Math.hypot(p.x - c.x, p.y - c.y) <= c.rad; }

addEventListener('touchstart', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    const p = toLocalPt(t.clientX, t.clientY);
    if (inCircle(p, circleOf(runBtn))) {
      sprint = !sprint;
      runBtn.classList.toggle('on', sprint);
      continue;
    }
    if (inCircle(p, circleOf(jumpBtn))) { doJump(); jumpBtn.classList.add('on'); continue; }
    if (inCircle(p, circleOf(stick)) && stickId === null) { stickId = t.identifier; continue; }
    if (lookId === null) { lookId = t.identifier; lookPrev = { x: p.x, y: p.y }; }
  }
  e.preventDefault();
}, { passive: false });

addEventListener('touchmove', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    const p = toLocalPt(t.clientX, t.clientY);
    if (t.identifier === stickId) {
      const c = circleOf(stick);
      let dx = p.x - c.x, dy = p.y - c.y;
      const len = Math.hypot(dx, dy), max = c.rad * .82;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      move.x = dx / max; move.z = -dy / max;
    } else if (t.identifier === lookId) {
      camYaw -= (p.x - lookPrev.x) * .0055;
      camPitch = clampPitch(camPitch + (p.y - lookPrev.y) * .0035);
      lookPrev = { x: p.x, y: p.y };
    }
  }
  e.preventDefault();
}, { passive: false });

addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) { stickId = null; move.x = move.z = 0; knob.style.transform = 'translate(0,0)'; }
    if (t.identifier === lookId) lookId = null;
    jumpBtn.classList.remove('on');
  }
}, { passive: false });
addEventListener('touchcancel', () => { runBtn.classList.remove('on'); });

let dragging = false, dragPrev = { x: 0, y: 0 };

addEventListener('mouseup', () => { dragging = false; });

/* ---------- 物理 ---------- */
const SPEED_WALK = 2.6, SPEED_RUN = 5.6;
const RADIUS = .42;

function blockedAt(x, z) {
  for (const b of blockers) {
    if (Math.hypot(x - b.x, z - b.z) < b.r + RADIUS) return true;
  }
  return false;
}

let facing = Math.PI;

const JUMP_V = 5.9, GRAVITY = 14;
let landPulse = 0;
function doJump() {
  if (!running || airborne) return;
  yVel = JUMP_V;
  airborne = true;
}

function update(dt) {
  let inX = move.x, fwd = move.z;
  if (keys['w']) fwd = 1;
  if (keys['s']) fwd = -1;
  if (keys['a']) inX = -1;
  if (keys['d']) inX = 1;
  const mag = Math.min(1, Math.hypot(inX, fwd));
  const isSprint = (sprint || shiftDown) && mag > .02;
  const inWater = Math.hypot(avatar.position.x - POND.x, avatar.position.z - POND.z) < POND.r - .6
    && !(Math.abs(avatar.position.x - BRIDGE.x) <= BRIDGE.halfW + .3 && avatar.position.z > BRIDGE.z0 && avatar.position.z < BRIDGE.z1);
  const speed = (isSprint ? SPEED_RUN : SPEED_WALK) * mag * (inWater ? .55 : 1);

  if (mag > .02) {
    const s = Math.sin(camYaw), c = Math.cos(camYaw);
    let wx = -s * fwd + c * inX;
    let wz = -c * fwd - s * inX;
    const wl = Math.hypot(wx, wz) || 1;
    wx /= wl; wz /= wl;

    const nx = avatar.position.x + wx * speed * dt;
    const nz = avatar.position.z + wz * speed * dt;
    if (!blockedAt(nx, avatar.position.z)) avatar.position.x = nx;
    if (!blockedAt(avatar.position.x, nz)) avatar.position.z = nz;

    const lim = GROUND - 7.5;
    avatar.position.x = THREE.MathUtils.clamp(avatar.position.x, -lim, lim);
    avatar.position.z = THREE.MathUtils.clamp(avatar.position.z, -lim, lim);

    const targetFace = Math.atan2(wx, wz);
    let d = targetFace - facing;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    facing += d * Math.min(1, dt * 12);
    avatar.rotation.y = facing;
  }

  // 垂直：跳跃 / 落地 / 上桥抬升
  const groundY = heightAt(avatar.position.x, avatar.position.z);
  if (airborne) {
    yVel -= GRAVITY * dt;
    avatar.position.y += yVel * dt;
    if (avatar.position.y <= groundY && yVel <= 0) {
      avatar.position.y = groundY; yVel = 0; airborne = false; landPulse = 1;
    }
  } else {
    avatar.position.y = THREE.MathUtils.lerp(avatar.position.y, groundY, Math.min(1, dt * 12));
    if (Math.abs(avatar.position.y - groundY) < .003) avatar.position.y = groundY;
  }
  landPulse = Math.max(0, landPulse - dt * 3.4);

  const gait = mag > .02 ? (isSprint ? 11.5 : 7.4) : 2.2;
  walkPhase += dt * gait * (mag > .02 ? 1 : .35);
  const amp = mag > .02 ? (isSprint ? .78 : .48) * mag : .055;
  bobY = (mag > .02 && !airborne) ? Math.abs(Math.sin(walkPhase)) * (isSprint ? .07 : .045) : 0;

  rig.legL.rotation.x = Math.sin(walkPhase) * amp;
  rig.legR.rotation.x = -Math.sin(walkPhase) * amp;
  rig.armL.rotation.x = -Math.sin(walkPhase) * amp * .85;
  rig.armR.rotation.x = Math.sin(walkPhase) * amp * .85;
  rig.armL.rotation.z = .12 + (isSprint ? .16 : 0);
  rig.armR.rotation.z = -.12 - (isSprint ? .16 : 0);
  if (airborne) {
    rig.legL.rotation.x = -.5; rig.legR.rotation.x = .32;
    rig.armL.rotation.x = -1.6; rig.armR.rotation.x = -1.6;
    rig.armL.rotation.z = .35; rig.armR.rotation.z = -.35;
    rig.hip.rotation.x = -.12;
    rig.scarfTail.rotation.x = -1.2;
  }
  rig.hip.position.y = .92 + Math.abs(Math.sin(walkPhase)) * (mag > .02 ? .06 : .012) - landPulse * .12;
  rig.hip.rotation.x = mag > .02 ? (isSprint ? -.16 : -.05) : Math.sin(walkPhase) * .01;
  rig.neck.rotation.x = mag > .02 ? -.06 : Math.sin(walkPhase * .5) * .02;
  rig.scarfTail.rotation.x = -Math.sin(walkPhase + .6) * (.18 + mag * .3) - (isSprint ? .5 : .15);
  rig.scarf.rotation.z = Math.sin(walkPhase * .5) * .05;

  aura.position.set(avatar.position.x, .02, avatar.position.z);
  aura.material.opacity = .16 + Math.sin(performance.now() / 500) * .05;

  speedEl.textContent = airborne ? 'AIRBORNE' : (mag > .02 ? (isSprint ? 'SPRINTING' : (inWater ? 'SPLASHING' : 'WALKING')) : 'STROLLING');
}

function camBlocked(px, py, pz) {
  if (py < .42) return true;
  if (Math.abs(px - BRIDGE.x) < BRIDGE.halfW + .2 && pz > BRIDGE.z0 - .3 && pz < BRIDGE.z1 + .3) {
    if (py < heightAt(px, pz) + .3) return true;
  }
  if (Math.hypot(px - POND.x, pz - POND.z) < POND.r && py < .55) return true;
  for (const b of blockers) {
    if (py > (b.h || 1.6) + .2) continue;
    if (Math.hypot(px - b.x, pz - b.z) < b.r + .28) return true;
  }
  return false;
}

function safeCamPos(head, want) {
  const delta = want.clone().sub(head);
  const len = delta.length();
  if (len < 1e-4) return head.clone();
  const dir = delta.clone().divideScalar(len);
  for (let t = .45; t < len; t += .25) {
    const px = head.x + dir.x * t, py = head.y + dir.y * t, pz = head.z + dir.z * t;
    if (camBlocked(px, py, pz)) {
      // 从阻挡点开始逐步回退，必须落在真正的空处，绝不返回未验证的位置
      for (let b = Math.max(.28, t - .2); b >= .28; b -= .06) {
        const q = head.clone().addScaledVector(dir, b);
        if (!camBlocked(q.x, q.y, q.z)) return q;
      }
      // 全被挡：直接贴着角色头顶，宁可拉近也不钻进模型
      const q = head.clone().addScaledVector(dir, .28);
      q.y = head.y + .12;
      return q;
    }
  }
  return want;
}

function updateCamera(dt) {
  const eyeY = firstPerson ? 1.62 + bobY * .8 : 1.28;
  const head = new THREE.Vector3(avatar.position.x, eyeY + avatar.position.y, avatar.position.z);

  if (firstPerson) {
    const dir = new THREE.Vector3(
      -Math.sin(camYaw) * Math.cos(camPitch),
      -Math.sin(camPitch),
      -Math.cos(camYaw) * Math.cos(camPitch)
    );
    camPos.lerp(head, camReady ? Math.min(1, dt * 14) : 1);
    camReady = true;
    camTarget.copy(camPos).add(dir);
    camera.position.copy(camPos);
    camera.lookAt(camTarget);
    return;
  }

  const off = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  ).multiplyScalar(camDist);
  const want = head.clone().add(off);
  want.y = Math.max(want.y, .6);

  // 站在桥上 / 桥边时，强制把相机抬到桥面之上，避免贴到桥板底面
  const nearBridge = Math.abs(avatar.position.x - BRIDGE.x) < BRIDGE.halfW + 2.4
    && avatar.position.z > BRIDGE.z0 - 3 && avatar.position.z < BRIDGE.z1 + 3;
  if (nearBridge) want.y = Math.max(want.y, avatar.position.y + 2.1);

  let okPos = safeCamPos(head, want);

  camPos.lerp(okPos, camReady ? Math.min(1, dt * 6) : 1);
  if (camBlocked(camPos.x, camPos.y, camPos.z)) camPos.copy(okPos);
  camReady = true;
  camTarget.lerp(head, Math.min(1, dt * 8));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
}

const mapCv = document.getElementById('map');
const mapCtx = mapCv.getContext('2d');
const coordEl = document.getElementById('coord');
const MAP_SPAN = 68;
let mapTimer = 0;

function drawMap() {
  const W = mapCv.width, H = mapCv.height;
  const sc = W / (MAP_SPAN * 2);
  const mx = x => (x + MAP_SPAN) * sc;
  const mz = z => (z + MAP_SPAN) * sc;

  mapCtx.clearRect(0, 0, W, H);
  mapCtx.fillStyle = 'rgba(228,240,250,.9)';
  mapCtx.fillRect(0, 0, W, H);

  mapCtx.fillStyle = 'rgba(150,180,140,.6)';
  mapCtx.beginPath();
  mapCtx.arc(mx(0), mz(0), (GROUND - 4) * sc, 0, 6.2832);
  mapCtx.fill();

  mapCtx.strokeStyle = 'rgba(70,105,130,.6)';
  mapCtx.lineWidth = 1.5;
  mapCtx.beginPath();
  mapCtx.arc(mx(0), mz(0), (GROUND - 4) * sc, 0, 6.2832);
  mapCtx.stroke();

  mapCtx.fillStyle = 'rgba(80,170,215,.75)';
  mapCtx.beginPath();
  mapCtx.arc(mx(POND.x), mz(POND.z), POND.r * sc, 0, 6.2832);
  mapCtx.fill();

  mapCtx.fillStyle = 'rgba(120,110,95,.9)';
  mapCtx.fillRect(mx(BRIDGE.x - BRIDGE.halfW), mz(BRIDGE.z0), BRIDGE.halfW * 2 * sc, (BRIDGE.z1 - BRIDGE.z0) * sc);

  mapCtx.fillStyle = 'rgba(58,120,72,.9)';
  for (const t of mapTrees) {
    mapCtx.beginPath(); mapCtx.arc(mx(t.x), mz(t.z), 2.2, 0, 6.2832); mapCtx.fill();
  }
  mapCtx.fillStyle = 'rgba(120,125,135,.9)';
  for (const r of mapRocks) {
    mapCtx.beginPath(); mapCtx.arc(mx(r.x), mz(r.z), 1.7, 0, 6.2832); mapCtx.fill();
  }

  mapCtx.fillStyle = 'rgba(210,150,60,.95)';
  mapCtx.beginPath(); mapCtx.arc(mx(TOWER.x), mz(TOWER.z), TOWER.r * sc + 1, 0, 6.2832); mapCtx.fill();

  const px = avatar.position.x, pz = avatar.position.z;
  const cxp = mx(px), czp = mz(pz);

  mapCtx.fillStyle = 'rgba(90,150,190,.2)';
  mapCtx.beginPath();
  mapCtx.moveTo(cxp, czp);
  mapCtx.arc(cxp, czp, 22, (-camYaw + Math.PI / 2) - .55, (-camYaw + Math.PI / 2) + .55);
  mapCtx.closePath();
  mapCtx.fill();

  mapCtx.save();
  mapCtx.translate(cxp, czp);
  mapCtx.rotate(-facing + Math.PI);
  mapCtx.fillStyle = '#1f8f7e';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -5.4);
  mapCtx.lineTo(-3.4, 4.2);
  mapCtx.lineTo(0, 2);
  mapCtx.lineTo(3.4, 4.2);
  mapCtx.closePath();
  mapCtx.fill();
  mapCtx.restore();

  mapCtx.strokeStyle = 'rgba(70,105,130,.3)';
  mapCtx.lineWidth = 1;
  mapCtx.strokeRect(.5, .5, W - 1, H - 1);

  coordEl.textContent = 'X ' + px.toFixed(0) + ' · Z ' + pz.toFixed(0);
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  if (running) update(dt);
  else {
    walkPhase += dt * .8;
    rig.hip.position.y = .92 + Math.sin(walkPhase) * .012;
    rig.scarfTail.rotation.x = -Math.sin(walkPhase * .7) * .1 - .1;
  }
  updateCamera(dt);

  const t = performance.now() / 1000;
  for (const l of lanterns) {
    const k = .75 + Math.sin(t * 2.2 + l.phase) * .25;
    l.light.intensity = .45 + k * .25;
    l.orb.material.emissiveIntensity = .55 + k * .35;
  }
  for (const rp of ripples) {
    rp.t += dt * .4;
    if (rp.t > 1) rp.t -= 1;
    const k = 1 + rp.t * 1.4;
    rp.mesh.scale.setScalar(k);
    rp.mesh.material.opacity = (1 - rp.t) * .3;
  }
  if (window.__towerOrb) {
    window.__towerOrb.material.emissiveIntensity = 1.15 + Math.sin(t * 1.6) * .35;
    towerHalo.material.opacity = .12 + Math.sin(t * 1.6) * .05;
  }

  mapTimer += dt;
  if (mapTimer > .12) { mapTimer = 0; drawMap(); }

  renderer.render(scene, camera);
}

startBtn.addEventListener('click', () => {
  running = true;
  overlay.style.display = 'none';
});

syncRot(false);
loop();
window.__garden = { scene, avatar, camera, move, renderer, jump: doJump };
</script>
