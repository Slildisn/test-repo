<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>铁墓 · 风之庭院</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#070a14;color:#e9eefc;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;user-select:none;touch-action:none;}
  body.rot{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;
    transform:rotate(90deg) translateY(-100vw);}
  canvas{display:block;width:100%;height:100%;}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(circle at 50% 46%,transparent 45%,rgba(0,0,0,.5) 100%);}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  #tip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:2px;color:#9fb3d9;padding:7px 14px;border-radius:20px;
    background:rgba(12,16,30,.6);border:1px solid rgba(140,180,255,.14);white-space:nowrap;}
  #speed{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:3px;color:#7f8db3;}
  #stick{position:absolute;left:22px;bottom:calc(56px + env(safe-area-inset-bottom));width:118px;height:118px;
    border-radius:50%;border:1px solid rgba(150,200,255,.2);
    background:radial-gradient(circle,rgba(110,160,255,.10),rgba(110,160,255,.02));
    box-shadow:inset 0 0 24px rgba(90,150,255,.13);}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(215,240,255,.75),rgba(95,160,255,.35));
    box-shadow:0 0 18px rgba(110,190,255,.5);}
  #run{position:absolute;right:26px;bottom:calc(58px + env(safe-area-inset-bottom));width:76px;height:76px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:3px;color:#d7f6e8;
    border:1px solid rgba(130,235,200,.45);background:radial-gradient(circle,rgba(80,230,180,.22),rgba(20,120,100,.08));
    box-shadow:0 0 18px rgba(60,220,170,.22);}
  #run.on{background:radial-gradient(circle,rgba(120,255,205,.55),rgba(30,180,140,.3));
    box-shadow:0 0 30px rgba(70,240,190,.55);}
  #overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:13px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 34%,rgba(24,46,72,.92),rgba(5,7,14,.97) 74%);}
  #overlay h1{font-size:26px;letter-spacing:4px;color:#f4f8ff;text-shadow:0 0 18px rgba(120,200,255,.45);}
  #overlay .tag{font-size:10px;letter-spacing:6px;color:#7f96c4;margin-top:-9px;}
  #overlay .sub{font-size:12.5px;line-height:1.95;color:#a9b6d4;max-width:330px;}
  #overlay .key{display:inline-block;border:1px solid rgba(160,200,255,.3);border-radius:5px;
    padding:1px 6px;margin:0 2px;font-size:11px;color:#cfe0ff;background:rgba(120,170,255,.08);}
  #start{margin-top:2px;padding:13px 40px;border-radius:30px;border:1px solid rgba(150,235,255,.5);
    background:linear-gradient(180deg,rgba(100,215,255,.32),rgba(55,120,240,.16));color:#f0fbff;
    font-size:15px;letter-spacing:6px;box-shadow:0 0 24px rgba(90,200,255,.3);}
  #start:active{transform:scale(.96);filter:brightness(1.2);}
  @media (orientation:landscape){
    #tip{top:10px;font-size:10px;padding:6px 12px;}
    #stick{width:100px;height:100px;left:calc(16px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));}
    #knob{width:40px;height:40px;margin:-20px 0 0 -20px;}
    #run{width:66px;height:66px;right:calc(20px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));}
    #speed{bottom:calc(8px + env(safe-area-inset-bottom));font-size:9px;}
    #overlay{gap:9px;}
    #overlay h1{font-size:20px;}
    #overlay .sub{line-height:1.7;max-width:560px;}
  }
  body.rot #tip{top:10px;font-size:10px;padding:6px 12px;}
  body.rot #stick{width:100px;height:100px;left:16px;bottom:30px;}
  body.rot #knob{width:40px;height:40px;margin:-20px 0 0 -20px;}
  body.rot #run{width:66px;height:66px;right:20px;bottom:30px;}
  body.rot #speed{bottom:8px;font-size:9px;}
  body.rot #overlay{gap:9px;}
  body.rot #overlay h1{font-size:20px;}
  body.rot #overlay .sub{line-height:1.7;max-width:560px;}
  @media (max-height:420px){#overlay .sub{display:none;}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="hud">
  <div id="tip">左摇杆走 · 右侧拖动转视角</div>
  <div id="speed">STROLLING</div>
  <div id="stick"><div id="knob"></div></div>
  <div id="run">疾跑</div>
</div>

<div id="overlay">
  <h1>铁墓 · 风之庭院</h1>
  <div class="tag">GARDEN ROAM · EXPLORE</div>
  <div class="sub">
    没有枪，也没人追你。慢慢走一圈就好。<br>
    手机：左摇杆移动 · 右侧拖动转视角 · 右下按住疾跑<br>
    电脑：<span class="key">W A S D</span> 移动 · <span class="key">Shift</span> 疾跑 · <span class="key">拖动鼠标</span> 转视角 · <span class="key">滚轮</span> 远近
  </div>
  <button id="start">开始漫游</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
let THREE;
try { THREE = await import('three'); }
catch (e1) {
  try { THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'); }
  catch (e2) { showFatal('三维库加载失败，检查网络后刷新。'); throw e2; }
}
function showFatal(msg) {
  const o = document.getElementById('overlay');
  if (!o) return;
  o.style.display = 'flex';
  o.innerHTML = '<h1 style="font-size:22px">启动失败</h1><div class="sub">' + msg + '</div>';
}

const cv = document.getElementById('cv');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  showFatal('浏览器没开 WebGL（3D 加速）。用 Chrome / Safari 打开，或开启硬件加速后刷新。');
  throw err;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d1424, 0.012);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 260);

function skyTexture() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#1c3a5e');
  grd.addColorStop(.35, '#16304a');
  grd.addColorStop(.62, '#101c2e');
  grd.addColorStop(1, '#080c16');
  g.fillStyle = grd; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = skyTexture();

/* ---------- 光 ---------- */
scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x1a2030, 0.85));
const sun = new THREE.DirectionalLight(0xffe9c9, 1.15);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0012;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x334466, 0.35));

/* ---------- 地面 ---------- */
const GROUND = 60;
function grassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#22302c'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 4200; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = 1 + Math.random() * 2.2;
    g.fillStyle = Math.random() < .5 ? 'rgba(58,92,74,.55)' : 'rgba(28,44,44,.6)';
    g.beginPath(); g.arc(x, y, r, 0, 6.28); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(24, 24);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND * 2, GROUND * 2),
  new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: .95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* 中央石径 */
const pathMat = new THREE.MeshStandardMaterial({ color: 0x3c4a5c, roughness: .85 });
for (let i = 0; i < 62; i++) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(1.5 + Math.random() * .8, 9), pathMat);
  s.rotation.x = -Math.PI / 2;
  s.position.set((Math.random() - .5) * 5, .015, 42 - i * 1.45);
  s.receiveShadow = true;
  scene.add(s);
}

/* ---------- 碰撞体 ---------- */
const blockers = [];
function addBlock(x, z, r) { blockers.push({ x, z, r }); }

/* ---------- 道具 ---------- */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: .9 });
const pineMat = new THREE.MeshStandardMaterial({ color: 0x2c5a48, roughness: .8 });
const pineMat2 = new THREE.MeshStandardMaterial({ color: 0x24513f, roughness: .8 });

function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .28, 2.2, 8), trunkMat);
  trunk.position.y = 1.1; trunk.castShadow = true;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(1.5 - i * .38, 1.6, 9), i % 2 ? pineMat2 : pineMat);
    c.position.y = 2.1 + i * .95; c.castShadow = true;
    g.add(c);
  }
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  g.rotation.y = Math.random() * 6.28;
  scene.add(g);
  addBlock(x, z, .55 * s);
}
for (let i = 0; i < 132; i++) {
  const a = Math.random() * 6.28, r = 12 + Math.random() * (GROUND - 18);
  tree(Math.sin(a) * r, Math.cos(a) * r, .85 + Math.random() * .55);
}

function rock(x, z, s) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0),
    new THREE.MeshStandardMaterial({ color: 0x4f5b6b, roughness: .95, flatShading: true }));
  m.position.set(x, s * .55, z);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  addBlock(x, z, s * .75);
}
for (let i = 0; i < 42; i++) {
  const a = Math.random() * 6.28, r = 8 + Math.random() * (GROUND - 12);
  rock(Math.sin(a) * r, Math.cos(a) * r, .5 + Math.random() * .7);
}

/* 灯笼 */
const lanterns = [];
function lantern(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 2.6, 8), trunkMat);
  pole.position.y = 1.3; pole.castShadow = true;
  g.add(pole);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(.22, 14, 12),
    new THREE.MeshStandardMaterial({ color: 0xffe6b8, emissive: 0xffb060, emissiveIntensity: 2.2, roughness: .4 }));
  orb.position.y = 2.75;
  g.add(orb);
  const pl = new THREE.PointLight(0xffb469, 1.9, 12, 1.6);
  pl.position.y = 2.75;
  g.add(pl);
  g.position.set(x, 0, z);
  scene.add(g);
  lanterns.push({ orb, light: pl, phase: Math.random() * 6.28 });
  addBlock(x, z, .3);
}
lantern(-4.5, 6); lantern(4.5, 6); lantern(-5, -5); lantern(5, -5);

/* 围栏 */
const fenceMat = new THREE.MeshStandardMaterial({ color: 0x33404f, roughness: .9 });
const ring = new THREE.Group();
for (let i = 0; i < 64; i++) {
  const a = i / 132 * 6.283;
  const x = Math.sin(a) * (GROUND - 4), z = Math.cos(a) * (GROUND - 4);
  const post = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.1, .12), fenceMat);
  post.position.set(x, .55, z);
  post.rotation.y = a;
  post.castShadow = true;
  ring.add(post);
}
scene.add(ring);

/* ---------- 角色 ---------- */
const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0c9a8, roughness: .8 });
const coatMat = new THREE.MeshStandardMaterial({ color: 0x2f6d73, roughness: .65, metalness: .05 });
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b3a52, roughness: .8 });
const bootMat = new THREE.MeshStandardMaterial({ color: 0x1c2532, roughness: .7 });
const scarfMat = new THREE.MeshStandardMaterial({ color: 0xffb454, roughness: .7, emissive: 0x6a3a00, emissiveIntensity: .35 });

const avatar = new THREE.Group();
const rig = {};

function part(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  (parent || avatar).add(m);
  return m;
}

/* 髖部总枢 */
const hipPivot = new THREE.Group();
hipPivot.position.y = .92;
avatar.add(hipPivot);
rig.hip = hipPivot;

/* 躯干 */
const torso = part(new THREE.CapsuleGeometry(.24, .34, 6, 14), coatMat, 0, .34, 0, hipPivot);
torso.scale.set(1.05, 1, .78);
part(new THREE.BoxGeometry(.09, .3, .02), new THREE.MeshStandardMaterial({ color: 0x9fe8f0, emissive: 0x2c7f8a, emissiveIntensity: .6, roughness: .4 }), 0, .36, .2, hipPivot);

/* 头 */
const neck = new THREE.Group();
neck.position.set(0, .62, 0);
hipPivot.add(neck);
rig.neck = neck;
part(new THREE.SphereGeometry(.215, 18, 14), skinMat, 0, .1, 0, neck).scale.set(.95, 1.05, .95);
const hair = part(new THREE.SphereGeometry(.23, 18, 14), new THREE.MeshStandardMaterial({ color: 0x231a16, roughness: .85 }), 0, .16, -.02, neck);
hair.scale.set(1, .85, 1.02);
part(new THREE.SphereGeometry(.032, 8, 6), new THREE.MeshBasicMaterial({ color: 0x1a2030 }), -.075, .1, .195, neck);
part(new THREE.SphereGeometry(.032, 8, 6), new THREE.MeshBasicMaterial({ color: 0x1a2030 }), .075, .1, .195, neck);

/* 围巾 */
const scarf = part(new THREE.TorusGeometry(.2, .055, 8, 18), scarfMat, 0, .58, 0, hipPivot);
scarf.rotation.x = Math.PI / 2;
rig.scarf = scarf;
const scarfTail = part(new THREE.BoxGeometry(.12, .42, .05), scarfMat, .1, .38, -.2, hipPivot);
scarfTail.rotation.z = .12;
rig.scarfTail = scarfTail;

/* 手臂 */
function arm(side) {
  const sh = new THREE.Group();
  sh.position.set(side * .31, .5, 0);
  hipPivot.add(sh);
  part(new THREE.CapsuleGeometry(.078, .34, 4, 10), coatMat, 0, -.19, 0, sh);
  part(new THREE.SphereGeometry(.075, 10, 8), skinMat, 0, -.4, 0, sh);
  return sh;
}
rig.armL = arm(-1);
rig.armR = arm(1);

/* 腿 */
function leg(side) {
  const hp = new THREE.Group();
  hp.position.set(side * .12, 0, 0);
  hipPivot.add(hp);
  part(new THREE.CapsuleGeometry(.095, .34, 4, 10), pantsMat, 0, -.22, 0, hp);
  part(new THREE.BoxGeometry(.16, .12, .28), bootMat, 0, -.46, .04, hp);
  return hp;
}
rig.legL = leg(-1);
rig.legR = leg(1);

avatar.position.set(0, 0, 6);
avatar.rotation.y = Math.PI;
scene.add(avatar);

/* 角色脚下光圈 */
const aura = new THREE.Mesh(new THREE.RingGeometry(.5, .72, 32),
  new THREE.MeshBasicMaterial({ color: 0x7fe3d0, transparent: true, opacity: .2, side: THREE.DoubleSide }));
aura.rotation.x = -Math.PI / 2;
aura.position.y = .02;
scene.add(aura);

/* ---------- 相机与输入 ---------- */
let camYaw = 0, camPitch = .38, camDist = 5.2;
let lookId = null, lookPrev = { x: 0, y: 0 }, stickId = null;
const move = { x: 0, z: 0 };
let running = false, sprint = false, shiftDown = false;
let walkPhase = 0, camReady = false;

const camPos = new THREE.Vector3(0, 2.4, 12);
const camTarget = new THREE.Vector3(0, 1.1, 6);

/* ---------- 方向 / 尺寸 ---------- */
let rotMode = false, rotUserSet = false;
try {
  const v = localStorage.getItem('garden_rot');
  if (v === '1' || v === '0') { rotMode = v === '1'; rotUserSet = true; }
} catch (e) {}
if (!rotUserSet) rotMode = innerWidth < innerHeight;

function toLocalPt(cx, cy) {
  if (!rotMode) return { x: cx, y: cy };
  return { x: cy, y: innerWidth - cx };
}
function stageSize() {
  return rotMode ? { w: innerHeight, h: innerWidth } : { w: innerWidth, h: innerHeight };
}
function fitViewport() {
  const s = stageSize();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.9));
  renderer.setSize(s.w, s.h, false);
  camera.aspect = s.w / s.h;
  camera.updateProjectionMatrix();
}
function syncRot(persist) {
  const land = innerWidth > innerHeight;
  if (!rotUserSet) rotMode = !land;
  if (land) rotMode = false;
  document.body.classList.toggle('rot', rotMode);
  fitViewport();
  setTimeout(fitViewport, 120);
  if (persist) { try { localStorage.setItem('garden_rot', rotMode ? '1' : '0'); } catch (e) {} }
}
addEventListener('resize', () => syncRot(false));
addEventListener('orientationchange', () => { syncRot(false); setTimeout(() => syncRot(false), 300); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => syncRot(false));

/* ---------- 触摸 ---------- */
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
const runBtn = document.getElementById('run');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

function circleOf(el) {
  const r = el.getBoundingClientRect();
  const c = toLocalPt(r.left + r.width / 2, r.top + r.height / 2);
  return { x: c.x, y: c.y, rad: Math.max(r.width, r.height) / 2 * 1.15 };
}
function inCircle(p, c) { return Math.hypot(p.x - c.x, p.y - c.y) <= c.rad; }

addEventListener('touchstart', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    const p = toLocalPt(t.clientX, t.clientY);
    if (inCircle(p, circleOf(runBtn))) { sprint = true; runBtn.classList.add('on'); continue; }
    if (inCircle(p, circleOf(stick)) && stickId === null) { stickId = t.identifier; continue; }
    if (lookId === null) { lookId = t.identifier; lookPrev = { x: p.x, y: p.y }; }
  }
  e.preventDefault();
}, { passive: false });

addEventListener('touchmove', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    const p = toLocalPt(t.clientX, t.clientY);
    if (t.identifier === stickId) {
      const c = circleOf(stick);
      let dx = p.x - c.x, dy = p.y - c.y;
      const len = Math.hypot(dx, dy), max = c.rad * .82;
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      move.x = dx / max; move.z = -dy / max;
    } else if (t.identifier === lookId) {
      camYaw -= (p.x - lookPrev.x) * .0055;
      camPitch = THREE.MathUtils.clamp(camPitch + (p.y - lookPrev.y) * .0035, .04, 1.05);
      lookPrev = { x: p.x, y: p.y };
    }
  }
  e.preventDefault();
}, { passive: false });

addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) { stickId = null; move.x = move.z = 0; knob.style.transform = 'translate(0,0)'; }
    if (t.identifier === lookId) lookId = null;
    if (inCircle(toLocalPt(t.clientX, t.clientY), circleOf(runBtn))) { sprint = false; runBtn.classList.remove('on'); }
  }
}, { passive: false });
addEventListener('touchcancel', () => { sprint = false; runBtn.classList.remove('on'); });

/* ---------- 键盘 ---------- */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'shift') shiftDown = true;
  if (k === ' ') overlay.style.display = 'none';
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift') shiftDown = false;
});
let dragging = false, dragPrev = { x: 0, y: 0 };
cv.addEventListener('mousedown', e => { dragging = true; dragPrev = { x: e.clientX, y: e.clientY }; });
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - dragPrev.x) * .005;
  camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - dragPrev.y) * .003, .04, 1.05);
  dragPrev = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('wheel', e => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * .0035, 2.4, 11);
  e.preventDefault();
}, { passive: false });

/* ---------- 物理 ---------- */
const SPEED_WALK = 2.6, SPEED_RUN = 5.6;
const RADIUS = .42;

function blockedAt(x, z) {
  for (const b of blockers) {
    if (Math.hypot(x - b.x, z - b.z) < b.r + RADIUS) return true;
  }
  return false;
}

let facing = Math.PI;

function update(dt) {
  let inX = move.x, fwd = move.z;
  if (keys['w']) fwd = 1;
  if (keys['s']) fwd = -1;
  if (keys['a']) inX = -1;
  if (keys['d']) inX = 1;
  const mag = Math.min(1, Math.hypot(inX, fwd));
  const isSprint = (sprint || shiftDown) && mag > .02;
  const speed = (isSprint ? SPEED_RUN : SPEED_WALK) * mag;

  if (mag > .02) {
    const s = Math.sin(camYaw), c = Math.cos(camYaw);
    let wx = -s * fwd + c * inX;
    let wz = -c * fwd - s * inX;
    const wl = Math.hypot(wx, wz) || 1;
    wx /= wl; wz /= wl;

    const nx = avatar.position.x + wx * speed * dt;
    const nz = avatar.position.z + wz * speed * dt;
    if (!blockedAt(nx, avatar.position.z)) avatar.position.x = nx;
    if (!blockedAt(avatar.position.x, nz)) avatar.position.z = nz;

    const lim = GROUND - 7.5;
    avatar.position.x = THREE.MathUtils.clamp(avatar.position.x, -lim, lim);
    avatar.position.z = THREE.MathUtils.clamp(avatar.position.z, -lim, lim);

    const targetFace = Math.atan2(wx, wz);
    let d = targetFace - facing;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    facing += d * Math.min(1, dt * 12);
    avatar.rotation.y = facing;
  }

  const gait = mag > .02 ? (isSprint ? 11.5 : 7.4) : 2.2;
  walkPhase += dt * gait * (mag > .02 ? 1 : .35);
  const amp = mag > .02 ? (isSprint ? .78 : .48) * mag : .055;

  rig.legL.rotation.x = Math.sin(walkPhase) * amp;
  rig.legR.rotation.x = -Math.sin(walkPhase) * amp;
  rig.armL.rotation.x = -Math.sin(walkPhase) * amp * .85;
  rig.armR.rotation.x = Math.sin(walkPhase) * amp * .85;
  rig.armL.rotation.z = .12 + (isSprint ? .16 : 0);
  rig.armR.rotation.z = -.12 - (isSprint ? .16 : 0);
  rig.hip.position.y = .92 + Math.abs(Math.sin(walkPhase)) * (mag > .02 ? .06 : .012);
  rig.hip.rotation.x = mag > .02 ? (isSprint ? -.16 : -.05) : Math.sin(walkPhase) * .01;
  rig.neck.rotation.x = mag > .02 ? -.06 : Math.sin(walkPhase * .5) * .02;
  rig.scarfTail.rotation.x = -Math.sin(walkPhase + .6) * (.18 + mag * .3) - (isSprint ? .5 : .15);
  rig.scarf.rotation.z = Math.sin(walkPhase * .5) * .05;

  aura.position.set(avatar.position.x, .02, avatar.position.z);
  aura.material.opacity = .16 + Math.sin(performance.now() / 500) * .05;

  speedEl.textContent = mag > .02 ? (isSprint ? 'SPRINTING' : 'WALKING') : 'STROLLING';
}

function updateCamera(dt) {
  const head = new THREE.Vector3(avatar.position.x, 1.28, avatar.position.z);
  const off = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  ).multiplyScalar(camDist);
  const want = head.clone().add(off);
  want.y = Math.max(want.y, .6);

  let okPos = want.clone();
  for (const b of blockers) {
    const flat = Math.hypot(okPos.x - b.x, okPos.z - b.z);
    const minR = b.r + .3;
    if (flat < minR) {
      const k = minR / (flat || 1);
      okPos.x = b.x + (okPos.x - b.x) * k;
      okPos.z = b.z + (okPos.z - b.z) * k;
    }
  }

  camPos.lerp(okPos, camReady ? Math.min(1, dt * 6) : 1);
  camReady = true;
  camTarget.lerp(head, Math.min(1, dt * 8));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  if (running) update(dt);
  else {
    walkPhase += dt * .8;
    rig.hip.position.y = .92 + Math.sin(walkPhase) * .012;
    rig.scarfTail.rotation.x = -Math.sin(walkPhase * .7) * .1 - .1;
  }
  updateCamera(dt);

  const t = performance.now() / 1000;
  for (const l of lanterns) {
    const k = .75 + Math.sin(t * 2.2 + l.phase) * .25;
    l.light.intensity = 1.7 + k * .5;
    l.orb.material.emissiveIntensity = 1.9 + k * .6;
  }
  renderer.render(scene, camera);
}

startBtn.addEventListener('click', () => {
  running = true;
  overlay.style.display = 'none';
});

syncRot(false);
loop();
window.__garden = { scene, avatar, camera, move, renderer };
</script>
</body>
