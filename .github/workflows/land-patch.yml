name: land-patch
# rerun: 2
on:
  push:
    paths:
      - '.github/workflows/land-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply landmark patch
        run: |
          ls -la
          python3 map2-patch.py
      - name: Commit
        run: |
          git config user.name 'map-bot'
          git config user.email '543015384@qq.com'
          git add index.html
          git rm -q landmark-block.txt minimap-block.txt loop-block.txt
          git commit -m 'feat(land): 高塔/镜湖/石桥 + 小地图 + 坐标'
          git push
