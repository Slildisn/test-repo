name: fire button fix
on:
  push:
    paths:
      - '.github/workflows/patch-btn.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: python3 .github/btn_patch.py
      - name: commit and clean up
        run: |
          git config user.name "cyrene-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git rm -f .github/btn_patch.py .github/workflows/patch-btn.yml
          git commit -m "fix(game): 开火/装填按钮 pointer-events 修复"
          git push
