name: map-size
on:
  push:
    paths:
      - '.github/workflows/map-size.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map size
        run: |
          python3 - <<'PY'
          import io,sys
          p='index.html'
          s=open(p,encoding='utf-8').read()
          if 'const GROUND = 60;' in s:
              print('already patched'); sys.exit(0)
          pairs=[
            ('const GROUND = 30;','const GROUND = 60;'),
            ('t.repeat.set(12, 12);','t.repeat.set(24, 24);'),
            ('new THREE.FogExp2(0x0d1424, 0.02)','new THREE.FogExp2(0x0d1424, 0.012)'),
            ('new THREE.PerspectiveCamera(62, 1, 0.1, 220)','new THREE.PerspectiveCamera(62, 1, 0.1, 260)'),
            ('sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;','sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;'),
            ('sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;','sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;'),
            ('sun.shadow.camera.far = 70;','sun.shadow.camera.far = 130;'),
            ('for (let i = 0; i < 26; i++) {','for (let i = 0; i < 62; i++) {'),
            ('s.position.set((Math.random() - .5) * 5, .015, 12 - i * 1.1);','s.position.set((Math.random() - .5) * 5, .015, 42 - i * 1.45);'),
            ('for (let i = 0; i < 22; i++) {','for (let i = 0; i < 64; i++) {'),
            ('const a = Math.random() * 6.28, r = 9 + Math.random() * (GROUND - 13);','const a = Math.random() * 6.28, r = 12 + Math.random() * (GROUND - 18);'),
            ('for (let i = 0; i < 14; i++) {','for (let i = 0; i < 42; i++) {'),
            ('const a = Math.random() * 6.28, r = 6 + Math.random() * (GROUND - 10);','const a = Math.random() * 6.28, r = 8 + Math.random() * (GROUND - 12);'),
            ('for (let i = 0; i < 64; i++) {','for (let i = 0; i < 132; i++) {'),
            ('const a = i / 64 * 6.283;','const a = i / 132 * 6.283;'),
            ('(Math.sin(a) * (GROUND - 6), z = Math.cos(a) * (GROUND - 6))','(Math.sin(a) * (GROUND - 4), z = Math.cos(a) * (GROUND - 4))'),
            ('camera.position.z = THREE.MathUtils.clamp(camera.position.z, -ARENA + 1, ARENA - 1);','camera.position.z = THREE.MathUtils.clamp(camera.position.z, -ARENA + 1, ARENA - 1);'),
          ]
          miss=[]
          for a,b in pairs:
              if a in s: s=s.replace(a,b,1)
              else: miss.append(a[:50])
          open(p,'w',encoding='utf-8').write(s)
          print('missed:',miss)
          PY
          git config user.name 'map-bot'
          git config user.email '543015384@qq.com'
          git add index.html
          git diff --cached --quiet && echo 'no change' || git commit -m 'feat(map): 庭院地图扩大一倍（120x120）'
          git push
